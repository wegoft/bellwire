name = "bellwire-api"
main = "src/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "api.bellwire.app", custom_domain = true }]
workers_dev = false
preview_urls = false

[vars]
APP_ENV = "production"
AUTH_ISSUER = "https://auth.bellwire.app"
AUTH_AUDIENCE = "bellwire-api"
APNS_BUNDLE_ID = "app.bellwire"
APP_URL_SCHEME = "bellwire"
APP_DISPLAY_NAME = "Bellwire"
APNS_ENVIRONMENT = "production"
ENTITLEMENT_ENFORCEMENT_MODE = "enforce"
LIVE_ACTIVITY_AUTOMATION_ENABLED = "false"
POSTHOG_HOST = "https://us.i.posthog.com"

[[d1_databases]]
binding = "DB"
database_name = "bellwire-production"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "d1/business"

[[services]]
binding = "AUTH_SERVICE"
service = "bellwire-auth"

[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "bellwire-deliveries"

[[queues.consumers]]
queue = "bellwire-deliveries"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "bellwire-deliveries-dlq"

[[durable_objects.bindings]]
name = "APNS_PROVIDER_TOKEN_AUTHORITY"
class_name = "ApnsProviderTokenAuthority"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApnsProviderTokenAuthority"]

[triggers]
crons = ["17 * * * *"]
